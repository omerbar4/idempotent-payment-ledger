# Full build and test suite on a GitHub-hosted runner.
# The integration tests use Testcontainers, which starts PostgreSQL through the runner's Docker
# daemon (preinstalled on ubuntu-24.04 runners); no service containers or secrets are needed.
# The k6 load test and the restart/recovery check are local, on-demand tools (see RUNBOOK.md)
# and are intentionally not part of CI.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify (JDK 21, Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Docker version (required by Testcontainers)
        run: docker version

      - name: Build and run all tests
        run: ./mvnw -B clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
